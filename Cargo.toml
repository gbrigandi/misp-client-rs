[package]
name = "misp-client"
version = "0.1.0"
edition = "2021"
authors = ["Gianluca Brigandi <gbrigand@gmail.com>"]
description = "A Rust client library for MISP threat intelligence platform"
license = "MIT"
repository = "https://github.com/gbrigandi/misp-client-rs"
readme = "README.md"
keywords = ["misp", "threat-intelligence", "security", "ioc", "api"]
categories = ["api-bindings", "network-programming"]

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2.0"
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"

[[example]]
name = "enrichment"
path = "examples/enrichment.rs"

[[example]]
name = "hunting"
path = "examples/hunting.rs"

[[example]]
name = "integration_test"
path = "examples/integration_test.rs"

[[example]]
name = "soc"
path = "examples/soc.rs"

[features]
default = ["rustls"]
rustls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/default-tls"]
